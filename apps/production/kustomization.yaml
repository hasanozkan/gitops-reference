# Production shape, validated in CI but not deployed by this repo: more
# replicas, a disruption budget, and pods spread across nodes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/library
  - ../base/assistant
  - pdb.yaml
patches:
  - target:
      kind: Deployment
      name: library
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: library
