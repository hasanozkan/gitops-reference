apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  labels:
    app.kubernetes.io/name: assistant
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant
        app.kubernetes.io/part-of: library-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant
          image: ghcr.io/hasanozkan/llm-assistant:main-1790272022-69c8c11 # {"$imagepolicy": "flux-system:assistant"}
          ports:
            - name: http
              containerPort: 8000
          env:
            # Traces over OTLP to Tempo when the observability stack runs; the
            # exporter just logs and drops when it does not (e.g. in CI).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.observability.svc:4318
            - name: OTEL_SERVICE_NAME
              value: llm-tool-calling-assistant
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
