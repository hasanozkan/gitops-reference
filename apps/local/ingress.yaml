apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-demo
  namespace: library
spec:
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: assistant
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: library
                port:
                  name: http
