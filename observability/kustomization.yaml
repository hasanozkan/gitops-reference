apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - helmreleases.yaml
generatorOptions:
  disableNameSuffixHash: true   # HelmRelease valuesFrom refers to these names
configMapGenerator:
  - name: values-kube-prometheus-stack
    files: [values.yaml=values-kube-prometheus-stack.yaml]
  - name: values-loki
    files: [values.yaml=values-loki.yaml]
  - name: values-tempo
    files: [values.yaml=values-tempo.yaml]
  - name: values-alloy
    files: [values.yaml=values-alloy.yaml]
  # Dashboards as code: Grafana's sidecar loads every ConfigMap with this label.
  - name: dashboard-library
    files: [library.json=dashboards/library.json]
    options:
      labels: {grafana_dashboard: "1"}
  - name: dashboard-assistant
    files: [assistant.json=dashboards/assistant.json]
    options:
      labels: {grafana_dashboard: "1"}
