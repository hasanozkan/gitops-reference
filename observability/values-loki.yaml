# Single binary on the filesystem: enough to show logs next to metrics and
# traces on a laptop; not a production layout.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
singleBinary:
  replicas: 1
  # Loki needs a writable /var/loki (its root filesystem is read-only); k3d's
  # local-path provisioner backs this small volume.
  persistence:
    enabled: true
    size: 2Gi
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
