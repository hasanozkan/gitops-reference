# A laptop-sized Prometheus + Alertmanager + Grafana. Cluster-internals
# scraping is off: this stack watches the apps, found through their own
# ServiceMonitors and PrometheusRules in any namespace.
crds:
  enabled: false            # installed by infrastructure/monitoring-crds.yaml
# The chart's Kubernetes dashboards would be empty (cluster scraping is off);
# only this repository's dashboards are loaded.
defaultDashboardsEnabled: false
defaultRules:
  create: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
kubelet:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 50m, memory: 256Mi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
grafana:
  # Local demo: anonymous viewer access, no password in Git.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.observability.svc:3100
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.observability.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
