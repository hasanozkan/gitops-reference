# The observability stack as its own Kustomization: it can be slow to become
# Ready (image pulls) without holding the apps back, and CI can leave it out.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./observability
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: gitops-reference
