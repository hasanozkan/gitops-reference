# Only the Prometheus Operator CRDs (ServiceMonitor, PrometheusRule, ...). Apps
# declare how they are scraped and alerted on next to their Deployment, so
# the CRDs belong to the platform layer — present in every cluster, including
# CI, whether or not the full observability stack runs there.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 12h
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "32.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
