# Default deny inbound for the namespace; each app opens exactly what it serves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: library
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: library-http
  namespace: library
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: library
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
