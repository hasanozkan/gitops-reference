# Default deny inbound for the namespace; each app opens exactly what it serves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: library
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http
  namespace: library
spec:
  # Each app serves HTTP on 8000 (API and /metrics); nothing else is open.
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: library-demo
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
